name: Release

# Build the neojoplin binary and publish it as a GitHub release on every push
# to the main branch. Only one release exists: the rolling "latest" one.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older Ubuntu keeps the glibc requirement of the binary low.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: neojoplin-linux-x86_64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            asset: neojoplin-linux-aarch64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: neojoplin-macos-aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p neojoplin-cli
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/neojoplin dist/${{ matrix.asset }}
          cd dist
          tar -czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
          rm ${{ matrix.asset }}
          (sha256sum ${{ matrix.asset }}.tar.gz 2>/dev/null || shasum -a 256 ${{ matrix.asset }}.tar.gz) > ${{ matrix.asset }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Replace the rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep a single release: drop the old one (and its tag), then recreate
          # it so the tag points at the commit that was just built.
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NeoJoplin latest (${GITHUB_SHA::7})" \
            --notes "Automated build of commit ${GITHUB_SHA} from ${GITHUB_REF_NAME}." \
            --latest
