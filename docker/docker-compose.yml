# Project name matches the original root-level setup, so the existing
# container and webdav-data volume are reused.
name: neojoplin

services:
  webdav:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webdav
    ports:
      - "8080:8080"
    volumes:
      - webdav-data:/srv/webdav
    restart: unless-stopped

volumes:
  webdav-data:
